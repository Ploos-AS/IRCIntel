name: DR Integrity Chain

on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrity-chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      IRCINTEL_BACKUP_S3_ENDPOINT: http://127.0.0.1:4566
      IRCINTEL_DR_EVIDENCE_S3_ENDPOINT: http://127.0.0.1:4566
      IRCINTEL_BACKUP_S3_ENCRYPTION: AES256
      IRCINTEL_WAL_RETENTION_DAYS: '42'
      IRCINTEL_BASEBACKUP_RETENTION_DAYS: '35'
      IRCINTEL_BACKUP_ALERT_WEBHOOK_URL: http://127.0.0.1:18080/alert
      IRCINTEL_ENVIRONMENT: qualification
      IRCINTEL_DR_EVIDENCE_S3_BUCKET: ircintel-dr-integrity-chain
      IRCINTEL_BASEBACKUP_S3_BUCKET: ircintel-dr-integrity-chain
    steps:
      - uses: actions/checkout@v4
      - name: Start provider
        run: |
          docker run -d --name ircintel-integrity-localstack -p 4566:4566 -e SERVICES=s3 localstack/localstack:4.4.0
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:4566/_localstack/health | grep -q '"s3"' && exit 0; sleep 1; done
          exit 1
      - name: Start alert receiver
        run: |
          cat >/tmp/receiver.py <<'PY'
          from http.server import BaseHTTPRequestHandler,HTTPServer
          class H(BaseHTTPRequestHandler):
              def do_POST(self): self.rfile.read(int(self.headers.get('Content-Length','0'))); self.send_response(204); self.end_headers()
              def log_message(self,*a): pass
          HTTPServer(('127.0.0.1',18080),H).serve_forever()
          PY
          python3 /tmp/receiver.py &
      - name: Configure provider
        run: |
          aws --endpoint-url "$IRCINTEL_BACKUP_S3_ENDPOINT" s3api create-bucket --bucket "$IRCINTEL_DR_EVIDENCE_S3_BUCKET"
          aws --endpoint-url "$IRCINTEL_BACKUP_S3_ENDPOINT" s3api put-bucket-encryption --bucket "$IRCINTEL_DR_EVIDENCE_S3_BUCKET" --server-side-encryption-configuration '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
          chmod +x ops/postgres/*.sh
          ops/postgres/s3-retention-policy.sh "$IRCINTEL_DR_EVIDENCE_S3_BUCKET" apply
      - name: Run M4.52 chain
        run: |
          mkdir -p build/qualification/m4-52
          ops/postgres/dr-integrity-chain.sh ci "$IRCINTEL_DR_EVIDENCE_S3_BUCKET" build/qualification/m4-52 | tee build/qualification/m4-52/chain-run.log
      - name: Verify off-host audit bundle
        run: |
          set -euo pipefail
          log=build/qualification/m4-52/chain-run.log
          grep -qx 'dr_integrity_chain_audit_bundle_verified=true' "$log"
          grep -qx 'dr_integrity_chain_audit_bundle_archived=true' "$log"
          bundle=$(grep '^dr_integrity_chain_audit_bundle=' "$log"|tail -1|cut -d= -f2-)
          key=$(grep '^dr_integrity_chain_audit_bundle_archive_key=' "$log"|tail -1|cut -d= -f2-)
          sha=$(sha256sum "$bundle"|awk '{print $1}')
          head=$(aws --endpoint-url "$IRCINTEL_DR_EVIDENCE_S3_ENDPOINT" s3api head-object --bucket "$IRCINTEL_DR_EVIDENCE_S3_BUCKET" --key "$key" --output json)
          python3 - "$head" "$sha" <<'PY'
          import json,sys
          m=json.loads(sys.argv[1]).get('Metadata',{})
          assert m['kind']=='ircintel-dr-audit-bundle'
          assert m['sha256']==sys.argv[2]
          assert len(m['evidence-sha256'])==64 and len(m['manifest-sha256'])==64
          PY
          aws --endpoint-url "$IRCINTEL_DR_EVIDENCE_S3_ENDPOINT" s3api get-object --bucket "$IRCINTEL_DR_EVIDENCE_S3_BUCKET" --key "$key" build/qualification/m4-52/restored-audit-bundle.json >/dev/null
          test "$(sha256sum build/qualification/m4-52/restored-audit-bundle.json|awk '{print $1}')" = "$sha"
      - name: Prove audit bundle archive idempotency
        run: |
          set -euo pipefail
          bundle=$(grep '^dr_integrity_chain_audit_bundle=' build/qualification/m4-52/chain-run.log|tail -1|cut -d= -f2-)
          out=$(ops/postgres/dr-audit-bundle-s3.sh "$bundle")
          printf '%s\n' "$out"
          grep -qx 'dr_audit_bundle_archive_result=already_present' <<<"$out"
      - name: Prove invalid bundle rejection
        run: |
          set -euo pipefail
          bundle=$(grep '^dr_integrity_chain_audit_bundle=' build/qualification/m4-52/chain-run.log|tail -1|cut -d= -f2-)
          cp "$bundle" build/qualification/m4-52/tampered-audit-bundle.json
          python3 - build/qualification/m4-52/tampered-audit-bundle.json <<'PY'
          import json,sys
          p=sys.argv[1]; d=json.load(open(p)); d['chain_verified']=False
          json.dump(d,open(p,'w'),sort_keys=True,separators=(',',':'))
          PY
          set +e
          ops/postgres/dr-audit-bundle-s3.sh build/qualification/m4-52/tampered-audit-bundle.json
          rc=$?
          set -e
          test "$rc" -eq 65
      - name: Upload M4.52 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m4-52-offhost-dr-audit-bundle
          path: build/qualification/m4-52/
          retention-days: 30
      - name: Cleanup
        if: always()
        run: docker rm -f ircintel-integrity-localstack >/dev/null 2>&1 || true
