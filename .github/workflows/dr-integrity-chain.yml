name: DR Integrity Chain

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity-chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      IRCINTEL_BACKUP_S3_ENDPOINT: http://127.0.0.1:4566
      IRCINTEL_DR_EVIDENCE_S3_ENDPOINT: http://127.0.0.1:4566
      IRCINTEL_BACKUP_S3_ENCRYPTION: AES256
      IRCINTEL_WAL_RETENTION_DAYS: '42'
      IRCINTEL_BASEBACKUP_RETENTION_DAYS: '35'
      IRCINTEL_BACKUP_ALERT_WEBHOOK_URL: http://127.0.0.1:18080/alert
      IRCINTEL_ENVIRONMENT: qualification
      IRCINTEL_DR_EVIDENCE_S3_BUCKET: ircintel-dr-integrity-chain
      IRCINTEL_BASEBACKUP_S3_BUCKET: ircintel-dr-integrity-chain
    steps:
      - uses: actions/checkout@v4
      - name: Start provider
        run: |
          docker run -d --name ircintel-integrity-localstack -p 4566:4566 -e SERVICES=s3 localstack/localstack:4.4.0
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:4566/_localstack/health | grep -q '"s3"' && exit 0; sleep 1; done
          exit 1
      - name: Start alert receiver
        run: |
          cat >/tmp/receiver.py <<'PY'
          from http.server import BaseHTTPRequestHandler,HTTPServer
          class H(BaseHTTPRequestHandler):
              def do_POST(self): self.rfile.read(int(self.headers.get('Content-Length','0'))); self.send_response(204); self.end_headers()
              def log_message(self,*a): pass
          HTTPServer(('127.0.0.1',18080),H).serve_forever()
          PY
          python3 /tmp/receiver.py &
      - name: Configure provider
        run: |
          aws --endpoint-url "$IRCINTEL_BACKUP_S3_ENDPOINT" s3api create-bucket --bucket "$IRCINTEL_DR_EVIDENCE_S3_BUCKET"
          aws --endpoint-url "$IRCINTEL_BACKUP_S3_ENDPOINT" s3api put-bucket-encryption --bucket "$IRCINTEL_DR_EVIDENCE_S3_BUCKET" --server-side-encryption-configuration '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
          chmod +x ops/postgres/*.sh
          ops/postgres/s3-retention-policy.sh "$IRCINTEL_DR_EVIDENCE_S3_BUCKET" apply
      - name: Run M4.49 chain
        run: |
          mkdir -p build/qualification/m4-49
          ops/postgres/dr-integrity-chain.sh ci "$IRCINTEL_DR_EVIDENCE_S3_BUCKET" build/qualification/m4-49 | tee build/qualification/m4-49/chain-run.log
      - name: Verify off-host manifest
        run: |
          set -euo pipefail
          log=build/qualification/m4-49/chain-run.log
          grep -qx 'dr_integrity_chain_manifest_archived=true' "$log"
          key=$(grep '^dr_integrity_chain_manifest_archive_key=' "$log"|tail -1|cut -d= -f2-)
          manifest=$(grep '^dr_integrity_chain_manifest=' "$log"|tail -1|cut -d= -f2-)
          expected=$(sha256sum "$manifest"|awk '{print $1}')
          head=$(aws --endpoint-url "$IRCINTEL_BACKUP_S3_ENDPOINT" s3api head-object --bucket "$IRCINTEL_DR_EVIDENCE_S3_BUCKET" --key "$key" --output json)
          test "$(printf '%s' "$head"|python3 -c 'import json,sys;print(json.load(sys.stdin)["Metadata"]["kind"])')" = ircintel-dr-evidence-manifest
          test "$(printf '%s' "$head"|python3 -c 'import json,sys;print(json.load(sys.stdin)["Metadata"]["sha256"])')" = "$expected"
          aws --endpoint-url "$IRCINTEL_BACKUP_S3_ENDPOINT" s3api get-object --bucket "$IRCINTEL_DR_EVIDENCE_S3_BUCKET" --key "$key" build/qualification/m4-49/restored-manifest.json >/dev/null
          test "$(sha256sum build/qualification/m4-49/restored-manifest.json|awk '{print $1}')" = "$expected"
      - name: Prove archive idempotency
        run: |
          manifest=$(grep '^dr_integrity_chain_manifest=' build/qualification/m4-49/chain-run.log|tail -1|cut -d= -f2-)
          ops/postgres/dr-evidence-manifest-s3.sh "$manifest" | grep -qx 'dr_manifest_archive_result=already_present'
      - name: Upload M4.49 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m4-49-offhost-dr-manifest-archive
          path: build/qualification/m4-49/
          retention-days: 30
      - name: Cleanup
        if: always()
        run: docker rm -f ircintel-integrity-localstack >/dev/null 2>&1 || true
