name: DR Integrity Chain

on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrity-chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      IRCINTEL_BACKUP_S3_ENDPOINT: http://127.0.0.1:4566
      IRCINTEL_DR_EVIDENCE_S3_ENDPOINT: http://127.0.0.1:4566
      IRCINTEL_BACKUP_S3_ENCRYPTION: AES256
      IRCINTEL_WAL_RETENTION_DAYS: '42'
      IRCINTEL_BASEBACKUP_RETENTION_DAYS: '35'
      IRCINTEL_BACKUP_ALERT_WEBHOOK_URL: http://127.0.0.1:18080/alert
      IRCINTEL_ENVIRONMENT: qualification
      IRCINTEL_DR_EVIDENCE_S3_BUCKET: ircintel-dr-integrity-chain
      IRCINTEL_BASEBACKUP_S3_BUCKET: ircintel-dr-integrity-chain
    steps:
      - uses: actions/checkout@v4
      - name: Start provider
        run: |
          docker run -d --name ircintel-integrity-localstack -p 4566:4566 -e SERVICES=s3 localstack/localstack:4.4.0
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:4566/_localstack/health | grep -q '"s3"' && exit 0; sleep 1; done
          exit 1
      - name: Start alert receiver
        run: |
          cat >/tmp/receiver.py <<'PY'
          from http.server import BaseHTTPRequestHandler,HTTPServer
          class H(BaseHTTPRequestHandler):
              def do_POST(self): self.rfile.read(int(self.headers.get('Content-Length','0'))); self.send_response(204); self.end_headers()
              def log_message(self,*a): pass
          HTTPServer(('127.0.0.1',18080),H).serve_forever()
          PY
          python3 /tmp/receiver.py &
      - name: Configure provider
        run: |
          aws --endpoint-url "$IRCINTEL_BACKUP_S3_ENDPOINT" s3api create-bucket --bucket "$IRCINTEL_DR_EVIDENCE_S3_BUCKET"
          aws --endpoint-url "$IRCINTEL_BACKUP_S3_ENDPOINT" s3api put-bucket-encryption --bucket "$IRCINTEL_DR_EVIDENCE_S3_BUCKET" --server-side-encryption-configuration '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
          chmod +x ops/postgres/*.sh
          ops/postgres/s3-retention-policy.sh "$IRCINTEL_DR_EVIDENCE_S3_BUCKET" apply
      - name: Run M4.53 chain
        run: |
          mkdir -p build/qualification/m4-53
          ops/postgres/dr-integrity-chain.sh ci "$IRCINTEL_DR_EVIDENCE_S3_BUCKET" build/qualification/m4-53 | tee build/qualification/m4-53/chain-run.log
      - name: Verify audit bundle restore record
        run: |
          set -euo pipefail
          log=build/qualification/m4-53/chain-run.log
          grep -qx 'dr_integrity_chain_audit_bundle_restore_verified=true' "$log"
          restore=$(grep '^dr_integrity_chain_audit_bundle_restore=' "$log"|tail -1|cut -d= -f2-)
          key=$(grep '^dr_integrity_chain_audit_bundle_archive_key=' "$log"|tail -1|cut -d= -f2-)
          python3 - "$restore" "$key" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d['schema']=='ircintel.dr-audit-bundle-restore.v1'
          assert d['result']=='ok' and d['metadata_verified'] is True and d['bundle_verified'] is True
          assert d['source_key']==sys.argv[2]
          for k in ('audit_bundle_sha256','evidence_sha256','manifest_sha256'):
              assert len(d[k])==64
          PY
      - name: Prove audit metadata tamper detection
        run: |
          set -euo pipefail
          log=build/qualification/m4-53/chain-run.log
          key=$(grep '^dr_integrity_chain_audit_bundle_archive_key=' "$log"|tail -1|cut -d= -f2-)
          head=$(aws --endpoint-url "$IRCINTEL_DR_EVIDENCE_S3_ENDPOINT" s3api head-object --bucket "$IRCINTEL_DR_EVIDENCE_S3_BUCKET" --key "$key" --output json)
          tmp=build/qualification/m4-53/tamper-source.json
          aws --endpoint-url "$IRCINTEL_DR_EVIDENCE_S3_ENDPOINT" s3api get-object --bucket "$IRCINTEL_DR_EVIDENCE_S3_BUCKET" --key "$key" "$tmp" >/dev/null
          sha=$(sha256sum "$tmp"|awk '{print $1}'); size=$(stat -c '%s' "$tmp")
          mode=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["mode"])' "$tmp")
          result=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["acceptance_result"])' "$tmp")
          evidence=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["evidence_sha256"])' "$tmp")
          aws --endpoint-url "$IRCINTEL_DR_EVIDENCE_S3_ENDPOINT" s3api put-object --bucket "$IRCINTEL_DR_EVIDENCE_S3_BUCKET" --key "$key" --body "$tmp" --metadata "sha256=$sha,size-bytes=$size,kind=ircintel-dr-audit-bundle,mode=$mode,result=$result,evidence-sha256=$evidence,manifest-sha256=$(printf '0%.0s' {1..64})" >/dev/null
          set +e
          ops/postgres/dr-audit-bundle-restore-verify.sh "$IRCINTEL_DR_EVIDENCE_S3_BUCKET" "$key" build/qualification/m4-53/tampered-restore.json
          rc=$?
          set -e
          test "$rc" -eq 74
      - name: Upload M4.53 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m4-53-dr-audit-bundle-restore
          path: build/qualification/m4-53/
          retention-days: 30
      - name: Cleanup
        if: always()
        run: docker rm -f ircintel-integrity-localstack >/dev/null 2>&1 || true
