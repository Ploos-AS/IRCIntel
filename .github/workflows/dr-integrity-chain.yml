name: DR Integrity Chain

on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrity-chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      IRCINTEL_BACKUP_S3_ENDPOINT: http://127.0.0.1:4566
      IRCINTEL_DR_EVIDENCE_S3_ENDPOINT: http://127.0.0.1:4566
      IRCINTEL_BACKUP_S3_ENCRYPTION: AES256
      IRCINTEL_WAL_RETENTION_DAYS: '42'
      IRCINTEL_BASEBACKUP_RETENTION_DAYS: '35'
      IRCINTEL_BACKUP_ALERT_WEBHOOK_URL: http://127.0.0.1:18080/alert
      IRCINTEL_ENVIRONMENT: qualification
      IRCINTEL_DR_EVIDENCE_S3_BUCKET: ircintel-dr-integrity-chain
      IRCINTEL_BASEBACKUP_S3_BUCKET: ircintel-dr-integrity-chain
    steps:
      - uses: actions/checkout@v4
      - name: Start provider
        run: |
          docker run -d --name ircintel-integrity-localstack -p 4566:4566 -e SERVICES=s3 localstack/localstack:4.4.0
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:4566/_localstack/health | grep -q '"s3"' && exit 0; sleep 1; done
          exit 1
      - name: Start alert receiver
        run: |
          cat >/tmp/receiver.py <<'PY'
          from http.server import BaseHTTPRequestHandler,HTTPServer
          class H(BaseHTTPRequestHandler):
              def do_POST(self): self.rfile.read(int(self.headers.get('Content-Length','0'))); self.send_response(204); self.end_headers()
              def log_message(self,*a): pass
          HTTPServer(('127.0.0.1',18080),H).serve_forever()
          PY
          python3 /tmp/receiver.py &
      - name: Configure provider
        run: |
          aws --endpoint-url "$IRCINTEL_BACKUP_S3_ENDPOINT" s3api create-bucket --bucket "$IRCINTEL_DR_EVIDENCE_S3_BUCKET"
          aws --endpoint-url "$IRCINTEL_BACKUP_S3_ENDPOINT" s3api put-bucket-encryption --bucket "$IRCINTEL_DR_EVIDENCE_S3_BUCKET" --server-side-encryption-configuration '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
          chmod +x ops/postgres/*.sh
          ops/postgres/s3-retention-policy.sh "$IRCINTEL_DR_EVIDENCE_S3_BUCKET" apply
      - name: Run M4.51 chain
        run: |
          mkdir -p build/qualification/m4-51
          ops/postgres/dr-integrity-chain.sh ci "$IRCINTEL_DR_EVIDENCE_S3_BUCKET" build/qualification/m4-51 | tee build/qualification/m4-51/chain-run.log
      - name: Verify audit bundle
        run: |
          set -euo pipefail
          log=build/qualification/m4-51/chain-run.log
          grep -qx 'dr_integrity_chain_audit_bundle_verified=true' "$log"
          bundle=$(grep '^dr_integrity_chain_audit_bundle=' "$log"|tail -1|cut -d= -f2-)
          python3 - "$bundle" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d['schema']=='ircintel.dr-audit-bundle.v1'
          assert d['result']=='ok' and d['chain_verified'] is True
          for k in ('evidence_sha256','manifest_sha256','acceptance_record_sha256','evidence_restore_sha256','manifest_restore_sha256'):
              assert len(d[k])==64
          PY
      - name: Prove audit bundle tamper detection
        run: |
          set -euo pipefail
          log=build/qualification/m4-51/chain-run.log
          record=$(grep '^dr_integrity_chain_record=' "$log"|tail -1|cut -d= -f2-)
          restore=$(grep '^dr_integrity_chain_restore=' "$log"|tail -1|cut -d= -f2-)
          manifest=$(grep '^dr_integrity_chain_manifest=' "$log"|tail -1|cut -d= -f2-)
          manifest_restore=$(grep '^dr_integrity_chain_manifest_restore=' "$log"|tail -1|cut -d= -f2-)
          cp "$manifest_restore" build/qualification/m4-51/tampered-manifest-restore.json
          python3 - build/qualification/m4-51/tampered-manifest-restore.json <<'PY'
          import json,sys
          p=sys.argv[1]; d=json.load(open(p)); d['evidence_sha256']='0'*64
          json.dump(d,open(p,'w'),sort_keys=True,separators=(',',':'))
          PY
          set +e
          ops/postgres/dr-audit-bundle.sh "$record" "$restore" "$manifest" build/qualification/m4-51/tampered-manifest-restore.json build/qualification/m4-51/tampered-bundle.json
          rc=$?
          set -e
          test "$rc" -eq 74
      - name: Upload M4.51 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m4-51-dr-audit-bundle
          path: build/qualification/m4-51/
          retention-days: 30
      - name: Cleanup
        if: always()
        run: docker rm -f ircintel-integrity-localstack >/dev/null 2>&1 || true
