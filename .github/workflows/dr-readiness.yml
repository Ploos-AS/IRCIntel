name: DR Readiness

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify CI DR contract
        run: |
          chmod +x ops/postgres/*.sh
          output="$(ops/postgres/dr-readiness.sh ci)"
          printf '%s\n' "$output"
          grep -qx 'dr_readiness_mode=ci' <<<"$output"
          grep -qx 'dr_contract_complete=true' <<<"$output"
          grep -qx 'dr_ready=true' <<<"$output"
      - name: Production fails without deployment inputs
        run: |
          set +e; ops/postgres/dr-readiness.sh production; rc=$?; set -e
          test "$rc" -eq 68
      - name: Reject unsafe local endpoint
        env: &base
          IRCINTEL_BASEBACKUP_S3_BUCKET: backups
          IRCINTEL_WAL_S3_BUCKET: backups
          IRCINTEL_DR_EVIDENCE_S3_BUCKET: evidence
          IRCINTEL_BACKUP_S3_ENDPOINT: https://objects.example.invalid
          IRCINTEL_BACKUP_ALERT_WEBHOOK_URL: https://alerts.example.invalid/ircintel
          IRCINTEL_WAL_RETENTION_DAYS: '42'
          IRCINTEL_BASEBACKUP_RETENTION_DAYS: '35'
          IRCINTEL_DR_EVIDENCE_RETENTION_DAYS: '365'
        run: |
          set +e; IRCINTEL_BACKUP_S3_ENDPOINT=http://127.0.0.1:4566 ops/postgres/dr-readiness.sh production; rc=$?; set -e
          test "$rc" -eq 68
      - name: Reject WAL retention invariant
        env: *base
        run: |
          set +e; IRCINTEL_WAL_RETENTION_DAYS=30 ops/postgres/dr-readiness.sh production; rc=$?; set -e
          test "$rc" -eq 68
      - name: Reject evidence retention shorter than base backup
        env: *base
        run: |
          set +e
          out=$(IRCINTEL_DR_EVIDENCE_RETENTION_DAYS=34 ops/postgres/dr-readiness.sh production 2>&1); rc=$?
          set -e
          printf '%s\n' "$out"
          test "$rc" -eq 68
          grep -qx 'dr_readiness_evidence_retention_invariant=false' <<<"$out"
      - name: Reject malformed evidence retention
        env: *base
        run: |
          set +e; out=$(IRCINTEL_DR_EVIDENCE_RETENTION_DAYS=abc ops/postgres/dr-readiness.sh production 2>&1); rc=$?; set -e
          test "$rc" -eq 68
          grep -qx 'dr_readiness_invalid_retention=true' <<<"$out"
      - name: Verify representative production configuration
        env: *base
        run: |
          output="$(ops/postgres/dr-readiness.sh production)"
          printf '%s\n' "$output"
          grep -qx 'dr_readiness_mode=production' <<<"$output"
          grep -qx 'dr_evidence_bucket=evidence' <<<"$output"
          grep -qx 'dr_evidence_retention_days=365' <<<"$output"
          grep -qx 'dr_evidence_retention_configured=true' <<<"$output"
          grep -qx 'dr_alert_routing_configured=true' <<<"$output"
          grep -qx 'dr_ready=true' <<<"$output"
