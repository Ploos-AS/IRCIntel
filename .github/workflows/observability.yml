name: Observability

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  postgres-observability:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ircintel
          POSTGRES_PASSWORD: ircintel
          POSTGRES_DB: ircintel_observability
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ircintel -d ircintel_observability"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      IRCINTEL_STORAGE_BACKEND: postgres
      IRCINTEL_DATABASE_URL: postgres://ircintel:ircintel@127.0.0.1:5432/ircintel_observability?sslmode=disable
      IRCINTEL_LISTEN: 127.0.0.1:18084
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - name: Build Core
        run: go build -o /tmp/ircintel ./cmd/ircintel
      - name: Start Core
        run: |
          /tmp/ircintel > /tmp/ircintel-observability.log 2>&1 &
          echo $! > /tmp/ircintel-observability.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18084/healthz | grep -qx 'ok'; then exit 0; fi
            if [ "$attempt" -eq 30 ]; then cat /tmp/ircintel-observability.log; exit 1; fi
            sleep 1
          done
      - name: Verify readiness and Prometheus metrics
        run: |
          curl --fail --silent http://127.0.0.1:18084/readyz | grep -qx 'ready'
          curl --fail --silent http://127.0.0.1:18084/metrics > /tmp/metrics.txt
          grep -q '^ircintel_ready 1$' /tmp/metrics.txt
          grep -q '^ircintel_maintenance_enabled 0$' /tmp/metrics.txt
          grep -q '^ircintel_maintenance_runs_total 0$' /tmp/metrics.txt
          grep -q '^ircintel_maintenance_failures_total 0$' /tmp/metrics.txt
          grep -q '^ircintel_http_requests_total ' /tmp/metrics.txt
          grep -q '^ircintel_process_uptime_seconds ' /tmp/metrics.txt
      - name: Show logs on failure
        if: failure()
        run: cat /tmp/ircintel-observability.log 2>/dev/null || true
      - name: Stop Core
        if: always()
        run: |
          if [ -f /tmp/ircintel-observability.pid ]; then kill "$(cat /tmp/ircintel-observability.pid)" 2>/dev/null || true; fi
