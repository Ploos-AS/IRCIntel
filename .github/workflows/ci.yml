name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ircintel
          POSTGRES_PASSWORD: ircintel
          POSTGRES_DB: ircintel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ircintel -d ircintel_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      IRCINTEL_TEST_POSTGRES_URL: postgres://ircintel:ircintel@127.0.0.1:5432/ircintel_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - run: go mod tidy
      - name: Verify dependency metadata is clean
        run: git diff --exit-code -- go.mod go.sum
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/ircintel

  postgres-runtime:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ircintel
          POSTGRES_PASSWORD: ircintel
          POSTGRES_DB: ircintel_runtime
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ircintel -d ircintel_runtime"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      IRCINTEL_STORAGE_BACKEND: postgres
      IRCINTEL_DATABASE_URL: postgres://ircintel:ircintel@127.0.0.1:5432/ircintel_runtime?sslmode=disable
      IRCINTEL_CORE_TOKEN: runtime-test-token
      IRCINTEL_LISTEN: 127.0.0.1:18081
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - name: Build Core
        run: go build -o /tmp/ircintel ./cmd/ircintel
      - name: Start Core on PostgreSQL
        run: |
          /tmp/ircintel > /tmp/ircintel.log 2>&1 &
          echo $! > /tmp/ircintel.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18081/healthz | grep -qx 'ok'; then
              exit 0
            fi
            if [ "$attempt" -eq 30 ]; then
              cat /tmp/ircintel.log
              exit 1
            fi
            sleep 1
          done
      - name: Exercise PostgreSQL runtime APIs
        run: |
          auth='Authorization: Bearer runtime-test-token'
          curl --fail --silent -X POST -H "$auth" -H 'Content-Type: application/json' \
            --data '{"id":"runtime-net","name":"Runtime Network"}' \
            http://127.0.0.1:18081/api/v1/registry/networks
          curl --fail --silent -X POST -H "$auth" -H 'Content-Type: application/json' \
            --data '{"id":"runtime-server","network_id":"runtime-net","name":"Runtime Server"}' \
            http://127.0.0.1:18081/api/v1/registry/servers
          curl --fail --silent -X POST -H "$auth" -H 'Content-Type: application/json' \
            --data '{"id":"runtime-endpoint","server_id":"runtime-server","host":"irc.runtime.example","port":"6697","tls":true}' \
            http://127.0.0.1:18081/api/v1/registry/endpoints
          curl --fail --silent -X POST -H "$auth" -H 'Content-Type: application/json' \
            --data '{"agent_id":"runtime-agent","observed_at":"2026-09-10T12:00:00Z","endpoint":{"host":"irc.runtime.example","port":"6697","tls":true},"result":{"reachable":true}}' \
            http://127.0.0.1:18081/api/v1/observations
          curl --fail --silent -H "$auth" http://127.0.0.1:18081/api/v1/registry > /tmp/registry.json
          curl --fail --silent -H "$auth" 'http://127.0.0.1:18081/api/v1/observations?host=irc.runtime.example&limit=10' > /tmp/observations.json
          curl --fail --silent -H "$auth" http://127.0.0.1:18081/api/v1/endpoints/status > /tmp/status.json
          python3 - <<'PY'
          import json
          registry = json.load(open('/tmp/registry.json'))
          observations = json.load(open('/tmp/observations.json'))
          status = json.load(open('/tmp/status.json'))
          assert any(n['id'] == 'runtime-net' for n in registry['networks'])
          assert any(e['id'] == 'runtime-endpoint' for e in registry['endpoints'])
          assert len(observations['observations']) == 1
          assert observations['observations'][0]['agent_id'] == 'runtime-agent'
          assert any(e['host'] == 'irc.runtime.example' for e in status['endpoints'])
          PY
      - name: Restart Core and verify persistence
        run: |
          kill "$(cat /tmp/ircintel.pid)"
          for attempt in $(seq 1 20); do
            if ! kill -0 "$(cat /tmp/ircintel.pid)" 2>/dev/null; then break; fi
            sleep 1
          done
          /tmp/ircintel > /tmp/ircintel-restart.log 2>&1 &
          echo $! > /tmp/ircintel.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18081/healthz | grep -qx 'ok'; then break; fi
            if [ "$attempt" -eq 30 ]; then cat /tmp/ircintel-restart.log; exit 1; fi
            sleep 1
          done
          auth='Authorization: Bearer runtime-test-token'
          curl --fail --silent -H "$auth" http://127.0.0.1:18081/api/v1/registry > /tmp/registry-after-restart.json
          curl --fail --silent -H "$auth" 'http://127.0.0.1:18081/api/v1/observations?host=irc.runtime.example&limit=10' > /tmp/observations-after-restart.json
          python3 - <<'PY'
          import json
          registry = json.load(open('/tmp/registry-after-restart.json'))
          observations = json.load(open('/tmp/observations-after-restart.json'))
          assert any(n['id'] == 'runtime-net' for n in registry['networks'])
          assert any(e['id'] == 'runtime-endpoint' for e in registry['endpoints'])
          assert len(observations['observations']) == 1
          assert observations['observations'][0]['agent_id'] == 'runtime-agent'
          PY
      - name: Show Core logs on failure
        if: failure()
        run: |
          cat /tmp/ircintel.log 2>/dev/null || true
          cat /tmp/ircintel-restart.log 2>/dev/null || true
      - name: Stop Core
        if: always()
        run: |
          if [ -f /tmp/ircintel.pid ]; then kill "$(cat /tmp/ircintel.pid)" 2>/dev/null || true; fi

  postgres-disaster-recovery:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ircintel
          POSTGRES_PASSWORD: ircintel
          POSTGRES_DB: ircintel_dr_source
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ircintel -d ircintel_dr_source"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      IRCINTEL_STORAGE_BACKEND: postgres
      IRCINTEL_DATABASE_URL: postgres://ircintel:ircintel@127.0.0.1:5432/ircintel_dr_source?sslmode=disable
      IRCINTEL_CORE_TOKEN: dr-test-token
      IRCINTEL_LISTEN: 127.0.0.1:18082
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - name: Build Core
        run: go build -o /tmp/ircintel ./cmd/ircintel
      - name: Seed source database through Core
        run: |
          /tmp/ircintel > /tmp/ircintel-dr-source.log 2>&1 &
          echo $! > /tmp/ircintel-dr.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18082/healthz | grep -qx 'ok'; then break; fi
            if [ "$attempt" -eq 30 ]; then cat /tmp/ircintel-dr-source.log; exit 1; fi
            sleep 1
          done
          auth='Authorization: Bearer dr-test-token'
          curl --fail --silent -X POST -H "$auth" -H 'Content-Type: application/json' \
            --data '{"id":"dr-net","name":"DR Network"}' \
            http://127.0.0.1:18082/api/v1/registry/networks
          curl --fail --silent -X POST -H "$auth" -H 'Content-Type: application/json' \
            --data '{"id":"dr-server","network_id":"dr-net","name":"DR Server"}' \
            http://127.0.0.1:18082/api/v1/registry/servers
          curl --fail --silent -X POST -H "$auth" -H 'Content-Type: application/json' \
            --data '{"id":"dr-endpoint","server_id":"dr-server","host":"irc.dr.example","port":"6697","tls":true}' \
            http://127.0.0.1:18082/api/v1/registry/endpoints
          for payload in \
            '{"agent_id":"dr-agent-a","observed_at":"2026-09-10T10:00:00Z","endpoint":{"host":"irc.dr.example","port":"6697","tls":true},"result":{"reachable":true}}' \
            '{"agent_id":"dr-agent-b","observed_at":"2026-09-10T10:00:10Z","endpoint":{"host":"irc.dr.example","port":"6697","tls":true},"result":{"reachable":true}}' \
            '{"agent_id":"dr-agent-a","observed_at":"2026-09-10T10:01:00Z","endpoint":{"host":"irc.dr.example","port":"6697","tls":true},"result":{"reachable":false}}' \
            '{"agent_id":"dr-agent-b","observed_at":"2026-09-10T10:02:00Z","endpoint":{"host":"irc.dr.example","port":"6697","tls":true},"result":{"reachable":false}}' \
            '{"agent_id":"dr-agent-a","observed_at":"2026-09-10T10:10:00Z","endpoint":{"host":"irc.dr.example","port":"6697","tls":true},"result":{"reachable":true}}' \
            '{"agent_id":"dr-agent-b","observed_at":"2026-09-10T10:11:00Z","endpoint":{"host":"irc.dr.example","port":"6697","tls":true},"result":{"reachable":true}}'; do
            curl --fail --silent -X POST -H "$auth" -H 'Content-Type: application/json' --data "$payload" \
              http://127.0.0.1:18082/api/v1/observations
          done
          curl --fail --silent -H "$auth" 'http://127.0.0.1:18082/api/v1/incidents/lifecycle?host=irc.dr.example&status=closed&limit=10' > /tmp/dr-incidents-before.json
          python3 - <<'PY'
          import json
          incidents = json.load(open('/tmp/dr-incidents-before.json'))['incidents']
          assert len(incidents) == 1
          assert incidents[0]['status'] == 'closed'
          PY
      - name: Create PostgreSQL logical backup
        run: |
          docker run --rm --network host -e PGPASSWORD=ircintel postgres:17 \
            pg_dump -h 127.0.0.1 -U ircintel -d ircintel_dr_source --format=custom --no-owner --no-acl \
            > /tmp/ircintel-dr.dump
          test -s /tmp/ircintel-dr.dump
      - name: Restore backup into clean database
        run: |
          docker run --rm --network host -e PGPASSWORD=ircintel postgres:17 \
            psql -h 127.0.0.1 -U ircintel -d postgres -v ON_ERROR_STOP=1 \
            -c 'CREATE DATABASE ircintel_dr_restored OWNER ircintel'
          cat /tmp/ircintel-dr.dump | docker run --rm -i --network host -e PGPASSWORD=ircintel postgres:17 \
            pg_restore -h 127.0.0.1 -U ircintel -d ircintel_dr_restored --no-owner --no-acl --exit-on-error
      - name: Start Core on restored database and verify recovery
        env:
          IRCINTEL_DATABASE_URL: postgres://ircintel:ircintel@127.0.0.1:5432/ircintel_dr_restored?sslmode=disable
        run: |
          kill "$(cat /tmp/ircintel-dr.pid)"
          for attempt in $(seq 1 20); do
            if ! kill -0 "$(cat /tmp/ircintel-dr.pid)" 2>/dev/null; then break; fi
            sleep 1
          done
          /tmp/ircintel > /tmp/ircintel-dr-restored.log 2>&1 &
          echo $! > /tmp/ircintel-dr.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18082/healthz | grep -qx 'ok'; then break; fi
            if [ "$attempt" -eq 30 ]; then cat /tmp/ircintel-dr-restored.log; exit 1; fi
            sleep 1
          done
          auth='Authorization: Bearer dr-test-token'
          curl --fail --silent -H "$auth" http://127.0.0.1:18082/api/v1/registry > /tmp/dr-registry-after.json
          curl --fail --silent -H "$auth" 'http://127.0.0.1:18082/api/v1/observations?host=irc.dr.example&limit=20' > /tmp/dr-observations-after.json
          curl --fail --silent -H "$auth" 'http://127.0.0.1:18082/api/v1/incidents/lifecycle?host=irc.dr.example&status=closed&limit=10' > /tmp/dr-incidents-after.json
          curl --fail --silent -H "$auth" 'http://127.0.0.1:18082/api/v1/networks/incidents/stats?network_id=dr-net' > /tmp/dr-stats-after.json
          python3 - <<'PY'
          import json
          registry = json.load(open('/tmp/dr-registry-after.json'))
          observations = json.load(open('/tmp/dr-observations-after.json'))['observations']
          incidents = json.load(open('/tmp/dr-incidents-after.json'))['incidents']
          stats = json.load(open('/tmp/dr-stats-after.json'))
          assert any(n['id'] == 'dr-net' for n in registry['networks'])
          assert any(e['id'] == 'dr-endpoint' for e in registry['endpoints'])
          assert len(observations) == 6
          assert len(incidents) == 1 and incidents[0]['status'] == 'closed'
          assert stats['network_id'] == 'dr-net'
          assert stats['total_incidents'] >= 1
          PY
      - name: Show disaster-recovery logs on failure
        if: failure()
        run: |
          cat /tmp/ircintel-dr-source.log 2>/dev/null || true
          cat /tmp/ircintel-dr-restored.log 2>/dev/null || true
      - name: Stop Core
        if: always()
        run: |
          if [ -f /tmp/ircintel-dr.pid ]; then kill "$(cat /tmp/ircintel-dr.pid)" 2>/dev/null || true; fi

  oci-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build OCI image
        run: docker build --build-arg VERSION="${GITHUB_SHA}" -t ircintel:m0.1 .
      - name: Verify non-root image user
        run: test "$(docker image inspect ircintel:m0.1 --format '{{.Config.User}}')" = "65532:65532"
      - name: Start container
        run: docker run -d --name ircintel-test -p 127.0.0.1:18080:8080 ircintel:m0.1
      - name: Smoke test runtime
        run: |
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:18080/healthz | grep -qx 'ok'; then
              break
            fi
            if [ "$attempt" -eq 20 ]; then
              docker logs ircintel-test
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18080/api/v1/version | grep -q '"name":"IRCIntel"'
      - name: Show logs on failure
        if: failure()
        run: docker logs ircintel-test || true
      - name: Stop container
        if: always()
        run: docker rm -f ircintel-test || true
