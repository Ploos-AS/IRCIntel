name: Live IRC probe qualification

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      host:
        description: IRC host to qualify
        required: true
        default: irc.libera.chat
      port:
        description: IRC TLS port
        required: true
        default: "6697"

permissions:
  contents: read

env:
  TARGET_HOST: irc.libera.chat
  TARGET_PORT: "6697"

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - name: Validate approved target
        run: |
          case "$TARGET_HOST" in
            irc.libera.chat) ;;
            *) echo "Target is not approved for M1.2 qualification: $TARGET_HOST" >&2; exit 1 ;;
          esac
      - name: Run one TLS IRC qualification probe
        run: |
          go run ./cmd/ircintel-probe \
            -host "$TARGET_HOST" \
            -port "$TARGET_PORT" \
            -tls=true \
            -timeout 20s \
            -contact "https://github.com/Ploos-AS/IRCIntel"
