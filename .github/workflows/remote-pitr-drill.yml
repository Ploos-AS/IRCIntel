name: Remote PITR Drill

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '47 3 * * 0'

permissions:
  contents: read

concurrency:
  group: remote-pitr-drill-${{ github.ref }}
  cancel-in-progress: false

jobs:
  remote-pitr:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      IRCINTEL_BACKUP_S3_ENDPOINT: http://127.0.0.1:4566
      IRCINTEL_BASEBACKUP_S3_ENDPOINT: http://127.0.0.1:4566
      IRCINTEL_WAL_S3_ENDPOINT: http://127.0.0.1:4566
      IRCINTEL_BASEBACKUP_S3_BUCKET: ircintel-drill
      IRCINTEL_WAL_S3_BUCKET: ircintel-drill
      IRCINTEL_BASEBACKUP_S3_PREFIX: postgres/basebackup
      IRCINTEL_WAL_S3_PREFIX: postgres/wal
    steps:
      - uses: actions/checkout@v4
      - name: Qualify remote-only PostgreSQL 17 PITR
        run: |
          chmod +x ops/postgres/remote-pitr-drill.sh
          ops/postgres/remote-pitr-drill.sh
