name: Remote PITR Drill

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Weekly remote recovery drill. UTC avoids DST-dependent scheduling.
    - cron: '47 3 * * 0'

permissions:
  contents: read

concurrency:
  group: remote-pitr-drill-${{ github.ref }}
  cancel-in-progress: false

jobs:
  remote-pitr:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      IRCINTEL_BACKUP_S3_ENDPOINT: http://127.0.0.1:4566
      IRCINTEL_BASEBACKUP_S3_ENDPOINT: http://127.0.0.1:4566
      IRCINTEL_WAL_S3_ENDPOINT: http://127.0.0.1:4566
      IRCINTEL_BASEBACKUP_S3_BUCKET: ircintel-drill
      IRCINTEL_WAL_S3_BUCKET: ircintel-drill
      IRCINTEL_BASEBACKUP_S3_PREFIX: postgres/basebackup
      IRCINTEL_WAL_S3_PREFIX: postgres/wal
    steps:
      - uses: actions/checkout@v4
      - name: Start remote S3-compatible storage
        run: |
          set -euo pipefail
          docker run -d --name ircintel-localstack -p 4566:4566 -e SERVICES=s3 localstack/localstack:4.4.0
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4566/_localstack/health | grep -q '"s3"'; then break; fi
            [ "$attempt" -lt 60 ] || { docker logs ircintel-localstack; exit 1; }
            sleep 1
          done
          aws --endpoint-url "$IRCINTEL_BACKUP_S3_ENDPOINT" s3api create-bucket --bucket "$IRCINTEL_BASEBACKUP_S3_BUCKET"
      - name: Create, archive and transfer PostgreSQL 17 recovery inputs
        run: |
          set -euo pipefail
          chmod +x ops/postgres/basebackup-s3.sh ops/postgres/wal-archive-s3.sh ops/postgres/pitr-fetch-s3.sh
          docker network create ircintel-remote-pitr
          mkdir -p /tmp/m434/archive /tmp/m434/base
          chmod 0777 /tmp/m434/archive /tmp/m434/base
          docker run -d --name m434-source --network ircintel-remote-pitr \
            -e POSTGRES_USER=ircintel -e POSTGRES_PASSWORD=ircintel -e POSTGRES_DB=ircintel \
            -v /tmp/m434/archive:/archive postgres:17 \
            -c wal_level=replica -c archive_mode=on -c "archive_command=test ! -f /archive/%f && cp %p /archive/%f"
          for attempt in $(seq 1 30); do
            docker exec m434-source psql -U ircintel -d ircintel -Atc 'SELECT 1' 2>/dev/null | grep -qx 1 && break
            [ "$attempt" -lt 30 ] || { docker logs m434-source; exit 1; }
            sleep 1
          done
          docker exec m434-source psql -U ircintel -d ircintel -v ON_ERROR_STOP=1 -c "CREATE TABLE remote_pitr(id integer PRIMARY KEY, marker text NOT NULL); INSERT INTO remote_pitr VALUES (1,'base');"
          docker exec m434-source pg_basebackup -U ircintel -D /tmp/basebackup -Fp -Xs -P
          docker cp m434-source:/tmp/basebackup/. /tmp/m434/base/
          docker exec m434-source psql -U ircintel -d ircintel -c "INSERT INTO remote_pitr VALUES (2,'before-target');"
          target="$(docker exec m434-source psql -U ircintel -d ircintel -Atc "SELECT clock_timestamp() + interval '2 seconds'")"
          printf '%s' "$target" > /tmp/m434/target
          sleep 3
          docker exec m434-source psql -U ircintel -d ircintel -c "INSERT INTO remote_pitr VALUES (3,'after-target'); SELECT pg_switch_wal();"
          sleep 3
          docker stop m434-source
          sudo chown -R "$(id -u):$(id -g)" /tmp/m434/base /tmp/m434/archive
          tar -C /tmp/m434 -czf /tmp/m434-base.tar.gz base
          ops/postgres/basebackup-s3.sh /tmp/m434-base.tar.gz m434-base.tar.gz | tee /tmp/m434/base-upload.txt
          grep -q '^basebackup_transfer_result=uploaded$' /tmp/m434/base-upload.txt
          wal_count=0
          for wal in /tmp/m434/archive/*; do
            [ -f "$wal" ] || continue
            ops/postgres/wal-archive-s3.sh "$wal" "$(basename "$wal")" >/tmp/m434/wal-upload.txt
            grep -Eq '^wal_archive_result=(uploaded|already_present)$' /tmp/m434/wal-upload.txt
            wal_count=$((wal_count + 1))
          done
          [ "$wal_count" -gt 0 ]
      - name: Destroy local recovery inputs and fetch only from remote storage
        run: |
          set -euo pipefail
          rm -rf /tmp/m434/base /tmp/m434/archive /tmp/m434-base.tar.gz
          ops/postgres/pitr-fetch-s3.sh m434-base.tar.gz postgres/wal /tmp/m434/remote | tee /tmp/m434/fetch.txt
          grep -q '^pitr_fetch_result=ok$' /tmp/m434/fetch.txt
          tar -C /tmp/m434/remote -xzf /tmp/m434/remote/basebackup.tar.gz
          test -f /tmp/m434/remote/base/PG_VERSION
      - name: Recover to target using remote-only inputs
        run: |
          set -euo pipefail
          target="$(cat /tmp/m434/target)"
          cat >> /tmp/m434/remote/base/postgresql.auto.conf <<EOF
          restore_command = 'cp /archive/%f %p'
          recovery_target_time = '$target'
          recovery_target_action = 'promote'
          EOF
          touch /tmp/m434/remote/base/recovery.signal
          chmod 0700 /tmp/m434/remote/base
          sudo chown -R 999:999 /tmp/m434/remote/base
          docker run -d --name m434-restored --network ircintel-remote-pitr \
            -v /tmp/m434/remote/base:/var/lib/postgresql/data \
            -v /tmp/m434/remote/wal:/archive:ro postgres:17
          for attempt in $(seq 1 60); do
            docker exec m434-restored pg_isready -U ircintel -d ircintel >/dev/null 2>&1 && break
            [ "$attempt" -lt 60 ] || { docker logs m434-restored; exit 1; }
            sleep 1
          done
          rows="$(docker exec m434-restored psql -U ircintel -d ircintel -Atc "SELECT string_agg(id || ':' || marker, ',' ORDER BY id) FROM remote_pitr")"
          echo "recovered=$rows"
          test "$rows" = '1:base,2:before-target'
          docker exec m434-restored psql -U ircintel -d ircintel -Atc 'SELECT pg_is_in_recovery()' | grep -qx f
          {
            echo '## Remote PITR recovery drill'
            echo
            echo "- trigger: ${{ github.event_name }}"
            echo '- PostgreSQL: 17'
            echo '- recovery source: S3-compatible remote storage only'
            echo "- recovered rows: $rows"
            echo "- target: $target"
            echo '- result: PASS'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Show diagnostics on failure
        if: failure()
        run: |
          docker logs m434-source 2>/dev/null || true
          docker logs m434-restored 2>/dev/null || true
          docker logs ircintel-localstack 2>/dev/null || true
      - name: Cleanup
        if: always()
        run: |
          docker rm -f m434-source m434-restored ircintel-localstack 2>/dev/null || true
          docker network rm ircintel-remote-pitr 2>/dev/null || true
