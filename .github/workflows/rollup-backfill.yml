name: Rollup Backfill

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  postgres-rollup-backfill:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ircintel
          POSTGRES_PASSWORD: ircintel
          POSTGRES_DB: ircintel_backfill
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ircintel -d ircintel_backfill"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      IRCINTEL_TEST_POSTGRES_URL: postgres://ircintel:ircintel@127.0.0.1:5432/ircintel_backfill?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - name: Qualify bounded resumable backfill
        run: go test ./internal/core -run 'TestPostgresRollupBackfill' -count=1 -v
