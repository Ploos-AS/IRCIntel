name: Historical Stats

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  postgres-historical-stats:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ircintel
          POSTGRES_PASSWORD: ircintel
          POSTGRES_DB: ircintel_history
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ircintel -d ircintel_history"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      IRCINTEL_STORAGE_BACKEND: postgres
      IRCINTEL_DATABASE_URL: postgres://ircintel:ircintel@127.0.0.1:5432/ircintel_history?sslmode=disable
      IRCINTEL_CORE_TOKEN: history-test-token
      IRCINTEL_LISTEN: 127.0.0.1:18083
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - name: Build Core
        run: go build -o /tmp/ircintel ./cmd/ircintel
      - name: Start Core
        run: |
          /tmp/ircintel > /tmp/ircintel-history.log 2>&1 &
          echo $! > /tmp/ircintel-history.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18083/healthz | grep -qx 'ok'; then exit 0; fi
            if [ "$attempt" -eq 30 ]; then cat /tmp/ircintel-history.log; exit 1; fi
            sleep 1
          done
      - name: Seed registry and historical observations
        run: |
          auth='Authorization: Bearer history-test-token'
          for payload in \
            '{"id":"history-net","name":"History Network"}' \
            '{"id":"other-net","name":"Other Network"}'; do
            curl --fail --silent -X POST -H "$auth" -H 'Content-Type: application/json' --data "$payload" \
              http://127.0.0.1:18083/api/v1/registry/networks
          done
          curl --fail --silent -X POST -H "$auth" -H 'Content-Type: application/json' \
            --data '{"id":"history-server","network_id":"history-net","name":"History Server"}' \
            http://127.0.0.1:18083/api/v1/registry/servers
          curl --fail --silent -X POST -H "$auth" -H 'Content-Type: application/json' \
            --data '{"id":"other-server","network_id":"other-net","name":"Other Server"}' \
            http://127.0.0.1:18083/api/v1/registry/servers
          curl --fail --silent -X POST -H "$auth" -H 'Content-Type: application/json' \
            --data '{"id":"history-endpoint","server_id":"history-server","host":"irc.history.example","port":"6697","tls":true}' \
            http://127.0.0.1:18083/api/v1/registry/endpoints
          curl --fail --silent -X POST -H "$auth" -H 'Content-Type: application/json' \
            --data '{"id":"other-endpoint","server_id":"other-server","host":"irc.other.example","port":"6697","tls":true}' \
            http://127.0.0.1:18083/api/v1/registry/endpoints
          now=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          old=$(date -u -d '2 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          previous=$(date -u -d '30 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          for payload in \
            "{\"agent_id\":\"history-prev\",\"observed_at\":\"$previous\",\"endpoint\":{\"host\":\"irc.history.example\",\"port\":\"6697\",\"tls\":true},\"result\":{\"reachable\":true,\"dual_stack_ok\":false}}" \
            "{\"agent_id\":\"other-prev\",\"observed_at\":\"$previous\",\"endpoint\":{\"host\":\"irc.other.example\",\"port\":\"6697\",\"tls\":true},\"result\":{\"reachable\":false,\"dual_stack_ok\":false}}" \
            "{\"agent_id\":\"history-a\",\"observed_at\":\"$old\",\"endpoint\":{\"host\":\"irc.history.example\",\"port\":\"6697\",\"tls\":true},\"result\":{\"reachable\":true,\"dual_stack_ok\":true}}" \
            "{\"agent_id\":\"history-b\",\"observed_at\":\"$old\",\"endpoint\":{\"host\":\"irc.history.example\",\"port\":\"6697\",\"tls\":true},\"result\":{\"reachable\":false,\"dual_stack_ok\":false}}" \
            "{\"agent_id\":\"history-a\",\"observed_at\":\"$now\",\"endpoint\":{\"host\":\"irc.history.example\",\"port\":\"6697\",\"tls\":true},\"result\":{\"reachable\":true,\"dual_stack_ok\":false}}" \
            "{\"agent_id\":\"other-a\",\"observed_at\":\"$old\",\"endpoint\":{\"host\":\"irc.other.example\",\"port\":\"6697\",\"tls\":true},\"result\":{\"reachable\":true,\"dual_stack_ok\":true}}"; do
            curl --fail --silent -X POST -H "$auth" -H 'Content-Type: application/json' --data "$payload" \
              http://127.0.0.1:18083/api/v1/observations
          done
      - name: Verify historical APIs
        run: |
          auth='Authorization: Bearer history-test-token'
          curl --fail --silent -H "$auth" 'http://127.0.0.1:18083/api/v1/history/observations?period=24h&host=irc.history.example' > /tmp/history-24h.json
          curl --fail --silent -H "$auth" 'http://127.0.0.1:18083/api/v1/history/observations?period=all&host=irc.history.example' > /tmp/history-all.json
          curl --fail --silent -H "$auth" 'http://127.0.0.1:18083/api/v1/history/networks?network_id=history-net&period=24h' > /tmp/network-history.json
          curl --fail --silent -H "$auth" 'http://127.0.0.1:18083/api/v1/history/networks/ranking?period=24h&limit=10' > /tmp/network-ranking.json
          python3 - <<'PY'
          import json
          h24 = json.load(open('/tmp/history-24h.json'))
          hall = json.load(open('/tmp/history-all.json'))
          net = json.load(open('/tmp/network-history.json'))
          ranking = json.load(open('/tmp/network-ranking.json'))
          assert h24['period'] == '24h'
          assert h24['granularity'] == 'hour'
          assert h24['host'] == 'irc.history.example'
          assert sum(p['observation_count'] for p in h24['points']) == 3
          assert hall['period'] == 'all'
          assert hall['granularity'] == 'day'
          assert sum(p['observation_count'] for p in hall['points']) == 4
          assert net['network_id'] == 'history-net'
          assert net['network_name'] == 'History Network'
          assert net['granularity'] == 'hour'
          assert sum(p['observation_count'] for p in net['points']) == 3
          assert ranking['period'] == '24h'
          assert ranking['granularity'] == 'hour'
          assert [item['network_id'] for item in ranking['items']] == ['other-net', 'history-net']
          assert ranking['items'][0]['rank'] == 1
          assert ranking['items'][0]['reachable_percent'] == 100
          assert ranking['items'][0]['previous_reachable_percent'] == 0
          assert ranking['items'][0]['reachable_trend_points'] == 100
          assert ranking['items'][1]['rank'] == 2
          assert abs(ranking['items'][1]['reachable_percent'] - (200/3)) < 0.0001
          assert ranking['items'][1]['previous_reachable_percent'] == 100
          assert ranking['items'][1]['reachable_trend_points'] < 0
          PY
      - name: Show logs on failure
        if: failure()
        run: cat /tmp/ircintel-history.log 2>/dev/null || true
      - name: Stop Core
        if: always()
        run: |
          if [ -f /tmp/ircintel-history.pid ]; then kill "$(cat /tmp/ircintel-history.pid)" 2>/dev/null || true; fi
